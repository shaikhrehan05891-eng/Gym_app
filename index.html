<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Dp's GYM</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#111;--mu:#666;--ac:#e63946;--ok:#2a9d5c;--bd:#e2e4e8}
@media(prefers-color-scheme:dark){:root{--bg:#121316;--card:#1c1e23;--tx:#f2f2f2;--mu:#9a9da5;--bd:#2c2f36}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.w{max-width:520px;margin:auto;padding:16px}.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
input{width:100%;padding:12px;margin:5px 0;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
button{padding:11px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:15px;cursor:pointer;margin:3px 3px 3px 0}
button.g{background:var(--bd);color:var(--tx)}button.ok{background:var(--ok)}
.t{display:flex;gap:6px;margin-bottom:12px}.t button{flex:1}.mu{color:var(--mu);font-size:13px}
.r{color:var(--ac);font-weight:600}.o{color:var(--ok);font-weight:600}.big{font-size:44px;font-weight:700}
h2{margin:6px 0 12px}
@media print{.np{display:none!important}}.st{display:flex;gap:6px}.st div{flex:1;text-align:center;padding:8px 2px}.st b{display:block;font-size:22px}</style></head><body><div class="w" id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,updateDoc,deleteDoc,collection,getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
// ====== YAHAN APNA FIREBASE CONFIG PASTE KARO ======
const cfg={
 apiKey:"AIzaSyBP4ZpmshodhuiAKHpgSntnobvp_f5pLmk",
 authDomain:"dp-s-gym.firebaseapp.com",
 projectId:"dp-s-gym",
 storageBucket:"dp-s-gym.firebasestorage.app",
 messagingSenderId:"441221044969",
 appId:"1:441221044969:web:92a67132f2ba4ef5ea6e78"
};
const ADMIN="faizanshaikh3785@gmail.com";
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const auth2=getAuth(initializeApp(cfg,"second"));
const $=s=>document.querySelector(s),A=$("#app");
const ymd=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>ymd(new Date()),addD=(s,n)=>{const d=new Date(s+"T12:00");d.setDate(d.getDate()+n);return ymd(d)};
const diff=s=>Math.round((new Date(s+"T12:00")-new Date(today()+"T12:00"))/864e5);
const mail=p=>p.replace(/\D/g,"")+"@gym.app",pw=p=>p+"@gym";
const L=()=>A.innerHTML="<p class='mu'>Loading...</p>";
let mode="member",members=[],tab="all",sq="",qrCode="";
window.setMode=m=>{mode=m;login()};
function login(msg=""){A.innerHTML=`<h2>🏋️ Dp's GYM</h2><div class="t"><button class="${mode=="member"?"":"g"}" onclick="setMode('member')">Member</button><button class="${mode=="admin"?"":"g"}" onclick="setMode('admin')">Admin</button></div>
<div class="c">${mode=="admin"?`<input id="u" type="email" placeholder="Admin email" value="${ADMIN}"><input id="p" type="password" placeholder="Password">`:`<input id="u" type="tel" placeholder="Phone number"><input id="p" type="password" inputmode="numeric" placeholder="PIN">`}
<button onclick="doLogin()">Login</button><div class="r">${msg}</div></div>`}
window.doLogin=async()=>{const u=$("#u").value.trim(),p=$("#p").value;
 try{await signInWithEmailAndPassword(auth,mode=="admin"?u:mail(u),mode=="admin"?p:pw(p))}
 catch(e){login(e.code=="auth/too-many-requests"?"Bahut baar galat try kiya, thodi der baad try karo":e.code=="auth/network-request-failed"?"Internet check karo":"Phone/PIN galat hai ya account nahi hai")}};
window.logout=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
 if(!u)return login();
 L();
 try{if(u.email===ADMIN)await admin();else await member(u.uid)}
 catch(e){A.innerHTML="<p class='r'>Kuch gadbad hui. Internet check karke refresh karo.</p><button onclick='logout()'>Logout</button>"}
});
async function member(uid){
 const r=await getDoc(doc(db,"members",uid));
 if(!r.exists())return A.innerHTML="<p>Account nahi mila. Gym se sampark karo.</p><button onclick='logout()'>Logout</button>";
 let m=r.data(),note="";
 const c=new URLSearchParams(location.search).get("c");
 if(c){
  const q=await getDoc(doc(db,"settings","qr"));
  if(!q.exists()||q.data().code!==c)note="❌ Ye QR purana hai. Gym ka naya QR scan karo.";
  else if(diff(m.expiry)<0)note="⚠️ Membership expire ho gayi. Pehle fee jama karo.";
  else if(m.lastCheckin===today())note="✅ Aaj ka check-in ho chuka hai.";
  else{m=await checkin(uid,m);note="✅ Check-in ho gaya! Keep going 💪"}
  history.replaceState(null,"",location.pathname);
 }
 const d=diff(m.expiry),ex=d<0;
 A.innerHTML=`<h2>Hi ${m.name} 👋</h2>${note?`<div class="c"><b>${note}</b></div>`:""}
 <div class="c"><div class="mu">Streak</div><div class="big">🔥 ${m.streak||0}</div><div class="mu">din lagatar${m.lastCheckin===today()?" · aaj check-in done":""}</div></div>
 <div class="c"><div class="mu">Membership expiry</div><div class="${ex?"r":"o"}">${m.expiry} ${ex?"(Expired, fee jama karo)":`(${d} din baaki)`}</div>${d<=3?`<div class="mu">Fee: ₹${m.fee||0}</div>`:""}</div>
 <div class="mu">Check-in ke liye gym ka QR scan karo.</div><button class="g" onclick="logout()">Logout</button>`}
async function checkin(uid,m){const s=m.lastCheckin===addD(today(),-1)?(m.streak||0)+1:1;
 await updateDoc(doc(db,"members",uid),{streak:s,lastCheckin:today()});return{...m,streak:s,lastCheckin:today()}}
async function newQR(){qrCode=Math.random().toString(36).slice(2,10);await setDoc(doc(db,"settings","qr"),{code:qrCode})}
async function admin(){
 const s=await getDocs(collection(db,"members"));members=s.docs.map(x=>({id:x.id,...x.data()}));
 const q=await getDoc(doc(db,"settings","qr"));if(q.exists())qrCode=q.data().code;else await newQR();
 drawAdmin()}
function drawAdmin(){
 A.innerHTML=`<h2 class="np">Admin Panel</h2>
 <div class="c np"><b>Naya member</b><input id="n" placeholder="Naam"><input id="ph" type="tel" placeholder="Phone (10 digit)"><input id="pn" inputmode="numeric" placeholder="PIN (4 digit)"><input id="fe" type="number" placeholder="Monthly fee ₹"><input id="mo" type="number" value="1" placeholder="Kitne mahine"><button onclick="addM()">Add member</button><div id="msg" class="r"></div></div>
 <div id="stats" class="st np"></div><div id="tabs" class="t np"></div>
 <input class="np" id="sr" placeholder="🔍 Naam ya phone se dhundo" value="${sq}" oninput="sq=this.value;list()"><div id="list" class="np"></div>
 <div class="c"><b>QR check-in</b><div class="mu">Is QR ko print karke gym mein lagao. Member scan karega to check-in lagega.</div><div id="qr" style="margin:10px;background:#fff;padding:8px;display:inline-block"></div><br>
 <button class="np" onclick="print()">Print QR</button><button class="g np" onclick="nq()">Naya QR banao</button></div>
 <button class="g np" onclick="logout()">Logout</button>`;
 new QRCode($("#qr"),{text:location.origin+location.pathname+"?c="+qrCode,width:180,height:180});list()}
function list(){
 const act=members.filter(m=>diff(m.expiry)>=0).length,soon=members.filter(m=>diff(m.expiry)>=0&&diff(m.expiry)<=3).length;
 $("#stats").innerHTML=`<div class="c"><b>${members.length}</b>Total</div><div class="c"><b class="o">${act}</b>Active</div><div class="c"><b class="r">${members.length-act}</b>Expired</div>`;
 $("#tabs").innerHTML=[["all","All"],["soon","Due soon ("+soon+")"],["red","🔴 Red list"]].map(t=>`<button class="${tab==t[0]?"":"g"}" onclick="tb('${t[0]}')">${t[1]}</button>`).join("");
 const k=sq.trim().toLowerCase();
 const f=members.filter(m=>(tab=="red"?diff(m.expiry)<0:tab=="soon"?diff(m.expiry)>=0&&diff(m.expiry)<=3:true)&&(!k||m.name.toLowerCase().includes(k)||m.phone.includes(k))).sort((a,b)=>a.expiry.localeCompare(b.expiry));
 $("#list").innerHTML=f.map(m=>{const d=diff(m.expiry);return`<div class="c"><b>${m.name}</b> <span class="mu">${m.phone}</span><br><span class="${d<0?"r":"o"}">${d<0?`Expired ${-d} din pehle`:`${d} din baaki`}</span> <span class="mu">· ${m.expiry} · ₹${m.fee||0} · 🔥${m.streak||0}</span><br>
 <button class="ok" onclick="renew('${m.id}',1)">+1 mahina</button><button class="ok" onclick="renew('${m.id}',3)">+3 mahine</button><button class="g" onclick="wa('${m.id}')">WhatsApp</button><button class="g" onclick="del('${m.id}')">Delete</button></div>`}).join("")||"<p class='mu'>Koi member nahi</p>"}
window.tb=t=>{tab=t;list()};
const ERR={"auth/weak-password":"PIN kam se kam 4 digit ka ho","auth/network-request-failed":"Internet check karo","permission-denied":"Permission nahi hai, Firestore rules check karo"};
window.addM=async()=>{const n=$("#n").value.trim(),ph=$("#ph").value.replace(/\D/g,"").slice(-10),pn=$("#pn").value.trim(),fe=+$("#fe").value||0,mo=+$("#mo").value||1;
 const M=t=>$("#msg").textContent=t;
 if(!n||ph.length!=10||pn.length<4)return M("Naam, 10 digit phone aur 4+ digit PIN do");
 if(members.some(m=>m.phone==ph))return M("Ye phone number pehle se hai");
 M("Add ho raha hai...");
 try{let uid;
  try{uid=(await createUserWithEmailAndPassword(auth2,mail(ph),pw(pn))).user.uid}
  catch(e){if(e.code=="auth/email-already-in-use")uid=(await signInWithEmailAndPassword(auth2,mail(ph),pw(pn))).user.uid;else throw e}
  await signOut(auth2);
  await setDoc(doc(db,"members",uid),{name:n,phone:ph,fee:fe,expiry:addD(today(),30*mo),streak:0,lastCheckin:""});admin()}
 catch(e){M(e.code=="auth/invalid-credential"?"Ye number pehle kisi aur PIN se bana tha. Firebase > Authentication se purana user delete karo.":ERR[e.code]||"Error: "+(e.code||e.message))}};
window.renew=async(id,n)=>{const m=members.find(x=>x.id==id);const base=diff(m.expiry)<0?today():m.expiry;m.expiry=addD(base,30*n);await updateDoc(doc(db,"members",id),{expiry:m.expiry});list()};
window.del=async id=>{const m=members.find(x=>x.id==id);if(confirm(m.name+" ko delete karein?")){await deleteDoc(doc(db,"members",id));members=members.filter(x=>x.id!=id);list()}};
window.nq=async()=>{if(confirm("Naya QR banane par purana print kiya QR band ho jayega. Pakka?")){await newQR();drawAdmin()}};
window.wa=id=>{const m=members.find(x=>x.id==id),d=diff(m.expiry);
 const t=d<0?`Hi ${m.name}, aapki gym membership ${m.expiry} ko expire ho gayi hai. Fee ₹${m.fee} jama karein. - Dp's GYM`:`Hi ${m.name}, aapki gym membership ${m.expiry} ko expire hogi. Fee ₹${m.fee} time par jama karein. - Dp's GYM`;
 open(`https://wa.me/91${m.phone}?text=${encodeURIComponent(t)}`)};
</script></body></html>
