 if(view=="more"){v.innerHTML=`<h3>More</h3><div class="c"><button style="width:100%" onclick="go('ads')">📢 Offers &amp; Notices (members ko dikhao)</button><button class="g" style="width:100%" onclick="bk()">📥 Backup (CSV)</button><button class="g" style="width:100%" onclick="go('qr')">🔒 QR aur location settings</button><button class="g" style="width:100%" onclick="go('pay')">💳 Payments</button><button class="g" style="width:100%" onclick="logout()">Logout</button></div><div class="cen mu">${BRAND.name} · Admin panel</div>`}

 if(view=="ads"){const nlv=ADS.filter(live).length;
  v.innerHTML=`<div class="row"><h3 style="margin:0">Offers &amp; Notices</h3><span class="pill go">${nlv} live</span></div><div class="mu" style="margin:6px 0 10px">Yahan jo post karoge wo sab members ke app ke Home par dikhega.</div>
  <div class="c"><b>Naya post</b><div id="ap" style="margin:12px 0"></div>
  <input type="file" id="af2" accept="image/*" style="display:none" onchange="adImg(this.files[0]);this.value=''">
  <button class="g" onclick="document.getElementById('af2').click()">${I("image",16).replace("margin:0 auto","margin:0 6px 0 0")} Photo</button><button class="g" onclick="adRm()">Photo hatao</button>
  <input id="at" placeholder="Title (jaise: Happy Diwali! ya Whey Protein)" maxlength="60" oninput="adPrev()">
  <textarea id="ax" rows="3" maxlength="500" placeholder="Message likho... (offer, notice, wishes)" oninput="adPrev()"></textarea>
  <input id="apr" type="number" inputmode="numeric" placeholder="Price ₹ (supplement ho to, warna khali)" oninput="adPrev()"><input id="amr" type="number" inputmode="numeric" placeholder="Purani price / MRP ₹ (optional)" oninput="adPrev()">
  <select id="asc" onchange="adPrev()"><option value="auto">Background: Auto (text ke hisab se)</option><option value="muscle">Bodybuilder</option><option value="supp">Supplement</option><option value="diwali">Diwali</option><option value="holi">Holi</option><option value="eid">Eid</option><option value="newyear">New Year</option><option value="tiranga">Tiranga</option><option value="sale">Sale / Offer</option></select>
  <select id="atg" onchange="adPrev()"><option value="offer">Offer</option><option value="fest">Festival</option><option value="new">New</option><option value="note">Notice</option></select>
  <div class="mu" style="margin-top:8px">Card ka rang (Auto = background ke hisab se)</div><div class="thm" id="thm">${Object.keys(TH).map(k=>`<i data-k="${k}" style="background:${TH[k][1]||"conic-gradient(#f59e0b,#ef4444,#a855f7,#3b82f6,#10b981,#f59e0b)"}" onclick="adTh('${k}')"></i>`).join("")}</div>
  <div class="mu" style="margin-top:8px">Last date (optional, uske baad apne aap hat jayega)</div><input id="au" type="date">
  <label class="chk"><input type="checkbox" id="apop"> App khulte hi popup mein dikhao</label>
  <button style="width:100%;margin-top:6px" onclick="postAd()">Post karo</button><div id="amsg" class="r" style="margin-top:6px"></div></div>
  <h3>Aapke posts (${ADS.length})</h3>${ADS.map(a=>`<div class="c">${adCard(a,1)}<div class="row" style="margin-top:10px"><span class="pill ${a.on===false?"r":live(a)?"o":"go"}">${a.on===false?"Hidden":live(a)?"Live":"Expired"}${a.popup?" · Popup":""}</span><span class="mu">${a.until?"Till "+a.until:""}</span></div><div style="margin-top:8px"><button class="g" onclick="tgAd('${a.id}')">${a.on===false?"Show karo":"Hide karo"}</button><button class="g" onclick="edAd('${a.id}')">Edit text</button><button class="g" onclick="delAd('${a.id}')">Delete</button></div></div>`).join("")||"<div class='c mu'>Abhi koi post nahi. Upar se pehla post banao.</div>"}`;adPrev()}
 if(view=="mem"){v.innerHTML=`<div class="row"><h3 style="margin:0">Members (${members.length})</h3><button onclick="tf()">+ Naya</button></div>
  <div class="c" id="af" style="display:none;margin-top:10px"><input id="n" placeholder="Naam"><input id="ph" type="tel" placeholder="Phone (10 digit)"><input id="pn" inputmode="numeric" placeholder="PIN (4 digit)"><input id="fe" type="number" placeholder="Monthly fee ₹">
  <select id="mo"><option value="1">1 mahina</option><option value="3">3 mahine</option><option value="6">6 mahine</option><option value="12">12 mahine</option></select><select id="md"><option>Cash</option><option>UPI</option></select><button onclick="addM()">Add member</button><div id="msg" class="r"></div></div>
  <div class="t" id="tabs"></div><input id="sr" placeholder="🔍 Naam ya phone" value="${sq}" oninput="sf(this.value)"><div id="list"></div>`;list()}
 if(view=="att"){v.innerHTML=`<h3>Aaj ki attendance (${att.length})</h3>${att.map(a=>`<div class="c row"><div style="display:flex;gap:12px;align-items:center">${av(a.name)}<b>${a.name}</b></div><span class="pill o">${a.time}</span></div>`).join("")||"<div class='c mu'>Abhi tak koi nahi aaya</div>"}`}
 if(view=="qr"){v.innerHTML=`<div class="c cen" id="qrc"><h2 style="margin:0">${BRAND.name}</h2><div class="mu" style="margin-bottom:12px">Scan karo aur check-in karo</div><div id="qr" style="background:#fff;padding:18px;display:inline-block;border-radius:12px"></div></div>
  <button onclick="print()">Print QR</button><button class="g" onclick="nq()">Naya QR banao</button><div class="c" style="margin-top:12px"><b>🔒 Ghar baithe check-in roko</b><div class="mu" style="margin:4px 0 8px">Gym mein khade hoke location set karo. Phir sirf gym ke 150m ke andar hi check-in hoga.</div><button class="ok" onclick="sg()">📍 Gym location set karo</button><button class="g" onclick="sgo()">Location check band</button><button class="g" onclick="lv()">${liveT?"⏹ Live QR band karo":"📺 Live QR mode"}</button><div class="mu">Live QR: kisi purane phone/TV par ye tab khula rakho, QR har 90 sec mein badalta hai (photo kaam nahi karegi).</div></div><button class="g" onclick="bk()">Backup (CSV)</button><button class="g" onclick="logout()">Logout</button>`;
  new QRCode($("#qr"),{text:location.origin+location.pathname+"?c="+qrCode,width:260,height:260,correctLevel:QRCode.CorrectLevel.M})}}
function list(){
 const soon=members.filter(m=>diff(m.expiry)>=0&&diff(m.expiry)<=3).length;
 $("#tabs").innerHTML=[["all","All"],["soon","Due soon ("+soon+")"],["red","🔴 Red list"]].map(t=>`<button class="${tab==t[0]?"":"g"}" onclick="tb('${t[0]}')">${t[1]}</button>`).join("");
 const k=sq.trim().toLowerCase();
 const f=members.filter(m=>(tab=="red"?diff(m.expiry)<0:tab=="soon"?diff(m.expiry)>=0&&diff(m.expiry)<=3:true)&&(!k||m.name.toLowerCase().includes(k)||m.phone.includes(k))).sort((a,b)=>a.expiry.localeCompare(b.expiry));
 $("#list").innerHTML=f.map(m=>`<div class="c"><div class="row" style="justify-content:flex-start;gap:12px">${av(m.name)}<div style="flex:1"><b>${m.name}</b><div class="mu">${m.phone}</div></div><span class="pill ${diff(m.expiry)<0?"r":diff(m.expiry)<=3?"go":"o"}">${diff(m.expiry)<0?"Expired":diff(m.expiry)<=3?"Due soon":"Active"}</span></div><div class="bar"><i style="width:${Math.max(4,Math.min(100,diff(m.expiry)/30*100))}%;background:${diff(m.expiry)<0?"#ff6b6b":diff(m.expiry)<=3?"#f5b301":"#2ecc71"}"></i></div><div>${stat(m)} <span class="mu">· ${m.expiry} · ₹${m.fee||0} · 🔥${m.streak||0}</span></div>
 <select id="pm${m.id}" style="width:auto;padding:8px;margin:8px 0 4px"><option>Cash</option><option>UPI</option></select><br>
 <button class="ok" onclick="renew('${m.id}',1)">+1 mahina</button><button class="ok" onclick="renew('${m.id}',3)">+3 mahine</button><button class="g" onclick="wa('${m.id}')">WhatsApp</button><button class="g" onclick="ed('${m.id}')">Edit</button><button class="g" onclick="rp('${m.id}')">Reset PIN</button><button class="g" onclick="del('${m.id}')">Delete</button></div>`).join("")||"<p class='mu'>Koi member nahi</p>"}
window.tb=t=>{tab=t;list()};window.sf=v=>{sq=v;list()};
window.adRm=()=>{AD.img="";adPrev()};window.adTh=k=>{AD.theme=k;adPrev()};
window.adPrev=()=>{const a={id:"prev",title:$("#at").value.trim(),text:$("#ax").value.trim(),img:AD.img,tag:$("#atg").value,theme:AD.theme,scene:$("#asc").value,price:$("#apr").value,mrp:$("#amr").value};
 $("#ap").innerHTML=adCard(a,1,false);document.querySelectorAll("#thm i").forEach(i=>i.classList.toggle("on",i.dataset.k==AD.theme))};
window.adImg=async f=>{if(!f)return;const M=t=>$("#amsg").textContent=t;M("Photo ready ho rahi hai...");
 try{const bm=await createImageBitmap(f);let w=900,q=.72,u;
  for(let i=0;i<5;i++){const k=Math.min(1,w/Math.max(bm.width,bm.height)),c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);u=c.toDataURL("image/jpeg",q);if(u.length<260000)break;w-=150;q-=.06}
  if(u.length>=700000)return M("Photo bahut badi hai, koi dusri photo chuno");
  AD.img=u;M("");adPrev()}catch(e){M("Photo khul nahi payi, dusri photo try karo")}};
window.postAd=async()=>{const M=t=>$("#amsg").textContent=t,t=$("#at").value.trim(),x=$("#ax").value.trim();
 const pr=Math.max(0,+$("#apr").value||0),mr=Math.max(0,+$("#amr").value||0);
 const o={title:t,text:x,img:AD.img||"",tag:$("#atg").value,theme:AD.theme,scene:$("#asc").value,price:pr,mrp:mr>pr?mr:0,until:$("#au").value||"",popup:$("#apop").checked,on:true,ts:Date.now()};
 M("Post ho raha hai...");
 try{const r=await addDoc(collection(db,"ads"),o);ADS.unshift({id:r.id,...o});AD={img:"",theme:"auto"};show();alert("Post live ho gaya ✅ Sab members ko dikhega")}
 catch(e){M(e.code=="permission-denied"?"Permission nahi mili. Firebase Firestore Rules mein 'ads' allow karo.":"Error: "+(e.code||e.message))}};
window.tgAd=async id=>{const a=ADS.find(x=>x.id==id);a.on=a.on===false;try{await updateDoc(doc(db,"ads",id),{on:a.on})}catch(e){a.on=!a.on;alert("Error: "+(e.code||e.message))}show()};
window.edAd=async id=>{const a=ADS.find(x=>x.id==id),t=prompt("Title",a.title||"");if(t===null)return;const x=prompt("Message",a.text||"");if(x===null)return;const pz=prompt("Price ₹ (khali = koi price nahi)",a.price||"");if(pz===null)return;const pv=Math.max(0,+pz||0);
 try{await updateDoc(doc(db,"ads",id),{title:t.trim(),text:x.trim(),price:pv});a.title=t.trim();a.text=x.trim();a.price=pv}catch(e){alert("Error: "+(e.code||e.message))}show()};
window.delAd=async id=>{if(!confirm("Ye post delete karein? Members ke app se bhi hat jayega."))return;try{await deleteDoc(doc(db,"ads",id));ADS=ADS.filter(x=>x.id!=id)}catch(e){alert("Error: "+(e.code||e.message))}show()};

const ERR={"auth/weak-password":"PIN kam se kam 4 digit ka ho","auth/network-request-failed":"Internet check karo","permission-denied":"Permission nahi hai, Firestore rules check karo"};
window.addM=async()=>{const n=$("#n").value.trim(),ph=$("#ph").value.replace(/\D/g,"").slice(-10),pn=$("#pn").value.trim(),fe=+$("#fe").value||0,mo=+$("#mo").value,md=$("#md").value;
 const M=t=>$("#msg").textContent=t;
 if(!n||ph.length!=10||pn.length<4)return M("Naam, 10 digit phone aur 4+ digit PIN do");
 if(members.some(m=>m.phone==ph))return M("Ye phone number pehle se hai");
 M("Add ho raha hai...");
 try{let uid;
  try{uid=(await createUserWithEmailAndPassword(auth2,mail(ph),pw(pn))).user.uid}
  catch(e){if(e.code=="auth/email-already-in-use")uid=(await signInWithEmailAndPassword(auth2,mail(ph),pw(pn))).user.uid;else throw e}
  await signOut(auth2);
  await setDoc(doc(db,"members",uid),{name:n,phone:ph,fee:fe,expiry:addD(today(),30*mo),joined:today(),streak:0,lastCheckin:""});
  await addDoc(collection(db,"payments"),{uid,name:n,amount:fe*mo,mode:md,months:mo,date:today()});admin()}
 catch(e){M(e.code=="auth/invalid-credential"?"Ye number pehle kisi aur PIN se bana tha. Firebase > Authentication se purana user delete karo.":ERR[e.code]||"Error: "+(e.code||e.message))}};
window.renew=async(id,n)=>{const m=members.find(x=>x.id==id),md=$("#pm"+id).value;const base=diff(m.expiry)<0?today():m.expiry;
 m.expiry=addD(base,30*n);await updateDoc(doc(db,"members",id),{expiry:m.expiry});
 const p={uid:id,name:m.name,amount:(m.fee||0)*n,mode:md,months:n,date:today()};await addDoc(collection(db,"payments"),p);pays.push(p);list()};
window.ed=async id=>{const m=members.find(x=>x.id==id);const n=prompt("Naam",m.name);if(n===null)return;const f=prompt("Monthly fee ₹",m.fee||0);if(f===null)return;
 m.name=n.trim()||m.name;m.fee=+f||0;await updateDoc(doc(db,"members",id),{name:m.name,fee:m.fee});list()};
window.del=async id=>{const m=members.find(x=>x.id==id);if(confirm(m.name+" ko delete karein?")){await deleteDoc(doc(db,"members",id));members=members.filter(x=>x.id!=id);list()}};
window.nq=async()=>{if(confirm("Naya QR banane par purana print kiya QR band ho jayega. Pakka?")){await newQR();show()}};
window.wa=id=>{const m=members.find(x=>x.id==id),d=diff(m.expiry);
 const t=d<0?`Hi ${m.name}, aapki gym membership ${m.expiry} ko expire ho gayi hai. Fee ₹${m.fee} jama karein. - ${BRAND.name}`:`Hi ${m.name}, aapki gym membership ${m.expiry} ko expire hogi. Fee ₹${m.fee} time par jama karein. - ${BRAND.name}`;
 open(`https://wa.me/${BRAND.cc}${m.phone}?text=${encodeURIComponent(t)}`)};
window.tf=()=>{const f=$("#af");f.style.display=f.style.display=="none"?"block":"none"};
let liveT=null;
window.sg=async()=>{try{const p=await pos();await setDoc(doc(db,"settings","gym"),{lat:p.latitude,lng:p.longitude,r:150});alert("Gym location save ho gayi ✅ (150m ke andar check-in hoga)")}catch(e){alert("Location nahi mili. Phone ki location ON karo aur Allow dabao.")}};
window.sgo=async()=>{await deleteDoc(doc(db,"settings","gym"));alert("Location check band ho gaya")};
window.lv=async()=>{if(liveT){clearInterval(liveT);liveT=null;await newQR();return show()}
 const rot=async()=>{const prev=qrCode;qrCode=Math.random().toString(36).slice(2,10);await setDoc(doc(db,"settings","qr"),{code:qrCode,prev,live:true});if(view=="qr")show()};
 await rot();liveT=setInterval(rot,90000)};
let rq=[];
window.rem=()=>{if(!rq.length)rq=members.filter(m=>diff(m.expiry)<=3).map(m=>m.id);const id=rq.shift();if(id)wa(id);const b=$("#rb");if(b)b.textContent=rq.length?`Agla reminder (${rq.length} baaki) →`:"Sab ho gaye ✅"};
window.bk=()=>{const r=["Naam,Phone,Fee,Expiry,Joined,Streak",...members.map(m=>[m.name,m.phone,m.fee||0,m.expiry,m.joined||"",m.streak||0].join(","))].join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([r],{type:"text/csv"}));a.download="members.csv";a.click()};
window.rp=async id=>{const m=members.find(x=>x.id==id),pn=prompt("Naya PIN (4 digit)");if(!pn)return;if(pn.length<4)return alert("PIN kam se kam 4 digit ka ho");
 const rv=(m.rv||0)+1;if(rv>3)return alert("Reset limit (3) poori ho gayi. Firebase > Authentication se ye user delete karo aur naya member add karo.");
 try{const c=await createUserWithEmailAndPassword(auth2,mail(m.phone,rv),pw(pn));await signOut(auth2);
  const data={...m};delete data.id;await setDoc(doc(db,"members",c.user.uid),{...data,rv});await deleteDoc(doc(db,"members",id));alert("PIN reset ho gaya ✅");admin()}
 catch(e){alert("Error: "+(e.code||e.message))}};
window.cp=async()=>{const n=prompt("Naya PIN (4 digit)");if(!n)return;if(n.length<4)return alert("PIN kam se kam 4 digit ka ho");
 try{await updatePassword(auth.currentUser,pw(n));alert("PIN badal gaya ✅")}catch(e){alert(e.code=="auth/requires-recent-login"?"Logout karke dobara login karo, phir PIN badlo":"Error: "+(e.code||e.message))}};
window.apr=async id=>{const r=reqs.find(x=>x.id==id),m=r&&members.find(x=>x.id==r.uid);if(!m)return alert("Member nahi mila");
 if(!confirm("₹"+r.amount+" UPI mein aaya? UTR "+r.utr+" apni UPI app mein check kar lo."))return;
 try{const base=diff(m.expiry)<0?today():m.expiry;m.expiry=addD(base,30*r.months);await updateDoc(doc(db,"members",r.uid),{expiry:m.expiry});
  const p={uid:r.uid,name:r.name,amount:r.amount,mode:"UPI",months:r.months,date:today()};await addDoc(collection(db,"payments"),p);pays.push(p);
  await updateDoc(doc(db,"payreq",id),{status:"approved"});reqs=reqs.filter(x=>x.id!=id);draw()}catch(e){alert("Error: "+(e.code||e.message))}};
window.rej=async id=>{if(!confirm("Ye request reject karein?"))return;try{await updateDoc(doc(db,"payreq",id),{status:"rejected"});reqs=reqs.filter(x=>x.id!=id);draw()}catch(e){alert("Error: "+(e.code||e.message))}};
</script></body></html>
